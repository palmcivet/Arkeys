name: Release

on:
  push:
    branches:
      - master
    paths:
      - Config/Version.xcconfig

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Resolve release
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          resolve_version() {
            awk '$1 == "MARKETING_VERSION" && $2 == "=" { print $3; exit }' \
              "$@"
          }

          version="$(resolve_version Config/Version.xcconfig)"
          if [[ -z "$version" ]]; then
            echo "MARKETING_VERSION is empty" >&2
            exit 1
          fi

          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "cannot resolve the commit before this push: $BEFORE_SHA" >&2
            exit 1
          fi

          if previous_config="$(
            git show "${BEFORE_SHA}:Config/Version.xcconfig" 2>/dev/null
          )"; then
            previous_version="$(
              printf '%s\n' "$previous_config" | resolve_version
            )"
            if [[ -z "$previous_version" ]]; then
              echo "previous MARKETING_VERSION is empty" >&2
              exit 1
            fi
          else
            previous_version="<none>"
          fi

          if [[ "$version" == "$previous_version" ]]; then
            echo "MARKETING_VERSION did not change; skipping release"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse --quiet --verify "refs/tags/v${version}" >/dev/null; then
            echo "tag v${version} already exists; refusing to publish it again" >&2
            exit 1
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Publishing Arkeys $previous_version -> $version from $GITHUB_SHA"

      - name: Show Xcode
        if: steps.release.outputs.should_publish == 'true'
        run: xcodebuild -version

      - name: Build and test
        if: steps.release.outputs.should_publish == 'true'
        run: make test

      - name: Archive and package
        if: steps.release.outputs.should_publish == 'true'
        run: ./Scripts/package.sh "$VERSION"

      - name: Publish GitHub Release
        if: steps.release.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Arkeys ${{ env.VERSION }}
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/Arkeys-${{ env.VERSION }}.zip
            dist/SHA256SUMS
