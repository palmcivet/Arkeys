name: Release

on:
  push:
    branches:
      - master
    paths:
      - Config/Version.xcconfig

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Resolve version
        run: |
          version="$(awk '$1 == "MARKETING_VERSION" { print $3; exit }' Config/Version.xcconfig)"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and test
        run: make test

      - name: Archive and package
        run: ./Scripts/package.sh "$VERSION"

      - name: Resolve release notes
        run: |
          git log -1 --no-merges --format='%b' \
            --grep="^chore(release): v${VERSION}$" > release-notes.md

      - name: Mint publisher token
        id: publisher
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISHER_PRIVATE_KEY }}
          repositories: Arkeys

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ steps.publisher.outputs.token }}
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Arkeys ${{ env.VERSION }}
          generate_release_notes: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/Arkeys-${{ env.VERSION }}.zip
            dist/SHA256SUMS

      - name: Mint tap token
        if: ${{ !contains(env.VERSION, '-') }}
        id: tap
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISHER_PRIVATE_KEY }}
          owner: palmcivet
          repositories: homebrew-tap
          permission-contents: write
          permission-metadata: read

      - name: Notify Homebrew tap
        if: ${{ !contains(env.VERSION, '-') }}
        env:
          GH_TOKEN: ${{ steps.tap.outputs.token }}
          VERSION: ${{ env.VERSION }}
        run: |
          gh api --method POST repos/palmcivet/homebrew-tap/dispatches \
            --input - <<EOF
          {
            "event_type": "package-release",
            "client_payload": {
              "package": "arkeys",
              "tag": "v${VERSION}"
            }
          }
          EOF
